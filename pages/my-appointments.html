<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments | HealthKart</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/my-appointments.css">
</head>

<body>

<!-- ================= HEADER ================= -->
<header class="navbar">
    <a href="../index.html" class="logo">
        <i class="fa-solid fa-heart-pulse"></i>
        <span>Health<span>Kart</span></span>
    </a>

    <nav>
        <a href="../index.html">Home</a>
        <a href="search.html">Medicines</a>
        <a href="compare.html">Compare</a>
        <a href="doctors.html">Doctors</a>
        <a href="my-health.html" class="active">My Health</a>
    </nav>

    <div class="nav-actions">
        <a href="cart.html" aria-label="Cart">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cartCount">0</span>
        </a>
    </div>
</header>

<!-- ================= MAIN CONTENT ================= -->
<main class="appointments-page">

    <!-- Breadcrumb -->
    <div style="font-size:13px; color:#687b72; margin-bottom:18px; display:flex; align-items:center; gap:8px;">
        <a href="../index.html" style="color:inherit; text-decoration:none;"><i class="fa-solid fa-house"></i> Home</a>
        <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
        <a href="my-health.html" style="color:inherit; text-decoration:none;">My Health</a>
        <i class="fa-solid fa-chevron-right" style="font-size:10px;"></i>
        <span style="color:#0b9f6e; font-weight:700;">My Appointments</span>
    </div>

    <div class="page-header">
        <h1>My Doctor Appointments</h1>
        <p>View your upcoming consultations, launch video calls, and manage your bookings.</p>
    </div>

    <!-- Filter Tabs -->
    <div class="tabs-container">
        <button type="button" class="tab-btn active" data-tab="upcoming">
            <i class="fa-regular fa-calendar-check"></i> Upcoming
            <span class="tab-count" id="countUpcoming">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="completed">
            <i class="fa-solid fa-circle-check"></i> Completed
            <span class="tab-count" id="countCompleted">0</span>
        </button>
        <button type="button" class="tab-btn" data-tab="cancelled">
            <i class="fa-solid fa-ban"></i> Cancelled
            <span class="tab-count" id="countCancelled">0</span>
        </button>
    </div>

    <!-- Appointments List Container -->
    <div class="appointments-list" id="appointmentsList">
        <div style="text-align:center; padding:50px; color:#687970;">
            <i class="fa-solid fa-spinner fa-spin" style="font-size:26px; color:#0b9f6e; margin-bottom:10px; display:block;"></i>
            Loading your appointments...
        </div>
    </div>

</main>

<script src="/socket.io/socket.io.js"></script>
<script type="module" src="../js/my-appointments.js"></script>
<script type="module" src="../js/nav-auth.js"></script>
</body>
</html>
